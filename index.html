
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Bag Checker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎒 Campus Bag Checker</h1>

        <p>Don't leave your essentials behind.</p>

        <h2>Where are you going?</h2>

        <button id="collegeBtn">College</button>
        <button id="labBtn">Lab</button>
        <button id="outingBtn">Outing</button>

    <div id="items"></div>
    <p id="progress">0 / 0 items packed</p>
    <p id="message"></p>
<div class="add-item">
    <input type="text" id="newItem" placeholder="Add your own item">
    <button id="addBtn">Add</button>
</div>

    </div>

    <script src="script.js"></script>

</body>

</html>
